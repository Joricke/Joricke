<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Chat — Admin Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: #2d3748;
            color: #fff;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header-actions { display: flex; gap: 8px; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn-export { background: #48bb78; color: #fff; }
        .btn-export:hover { background: #38a169; }
        .btn-secondary { background: #4a5568; color: #fff; }
        .btn-secondary:hover { background: #2d3748; }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* --- Stats Cards --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .stat-card .label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-card .value { font-size: 28px; font-weight: 700; margin-top: 4px; color: #2d3748; }

        /* --- Filters --- */
        .filters {
            background: #fff;
            border-radius: 10px;
            padding: 16px 20px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            display: flex;
            gap: 12px;
            align-items: end;
            flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; gap: 4px; }
        .filter-group label { font-size: 12px; font-weight: 600; color: #666; }
        .filter-group input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
        }
        .filter-group input:focus { outline: none; border-color: #4299e1; }
        .btn-filter { background: #4299e1; color: #fff; align-self: end; }
        .btn-filter:hover { background: #3182ce; }

        /* --- Transcript List --- */
        .transcript-list {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .transcript-list h2 {
            padding: 16px 20px;
            font-size: 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        .transcript-item {
            padding: 14px 20px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s;
        }
        .transcript-item:hover { background: #f7fafc; }
        .transcript-item .info { display: flex; flex-direction: column; gap: 2px; }
        .transcript-item .student { font-weight: 600; font-size: 14px; }
        .transcript-item .meta { font-size: 12px; color: #888; }
        .transcript-item .badge {
            background: #e2e8f0;
            color: #4a5568;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #999;
            font-size: 14px;
        }

        /* --- Transcript Detail Modal --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #fff;
            border-radius: 12px;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-size: 16px; }
        .btn-close {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            color: #888;
            padding: 4px 8px;
        }
        .btn-close:hover { color: #333; }
        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-message { margin-bottom: 14px; }
        .modal-message .role {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .modal-message .role.user { color: #2b6cb0; }
        .modal-message .role.assistant { color: #276749; }
        .modal-message .content {
            background: #f7fafc;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .modal-message .timestamp { font-size: 11px; color: #aaa; margin-top: 4px; }

        .loading { text-align: center; padding: 20px; color: #888; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Research Chat — Admin Dashboard</h1>
        <div class="header-actions">
            <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
            <button class="btn btn-secondary" onclick="exportJSON()">Export JSON</button>
        </div>
    </div>

    <div class="container">
        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="label">Total Messages</div><div class="value" id="statMessages">-</div></div>
            <div class="stat-card"><div class="label">Conversations</div><div class="value" id="statConversations">-</div></div>
            <div class="stat-card"><div class="label">Students</div><div class="value" id="statStudents">-</div></div>
            <div class="stat-card"><div class="label">Tasks</div><div class="value" id="statTasks">-</div></div>
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>Student ID</label>
                <input type="text" id="filterStudent" placeholder="e.g. S001">
            </div>
            <div class="filter-group">
                <label>Task ID</label>
                <input type="text" id="filterTask" placeholder="e.g. prog_hw_1">
            </div>
            <button class="btn btn-filter" onclick="loadTranscripts()">Filter</button>
            <button class="btn btn-secondary" onclick="clearFilters()">Clear</button>
        </div>

        <!-- Transcripts -->
        <div class="transcript-list">
            <h2>Conversations</h2>
            <div id="transcriptList">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Transcript Detail Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Transcript</h3>
                <button class="btn-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        var API_BASE = "http://localhost:8000";

        // --- Load Stats ---
        async function loadStats() {
            try {
                var resp = await fetch(API_BASE + "/admin/stats");
                var data = await resp.json();
                document.getElementById("statMessages").textContent = data.total_messages;
                document.getElementById("statConversations").textContent = data.total_conversations;
                document.getElementById("statStudents").textContent = data.total_students;
                document.getElementById("statTasks").textContent = data.total_tasks;
            } catch (e) {
                console.error("Failed to load stats:", e);
            }
        }

        // --- Load Transcripts ---
        async function loadTranscripts() {
            var container = document.getElementById("transcriptList");
            container.innerHTML = '<div class="loading">Loading...</div>';

            var student = document.getElementById("filterStudent").value.trim();
            var task = document.getElementById("filterTask").value.trim();
            var params = new URLSearchParams();
            if (student) params.set("student_id", student);
            if (task) params.set("task_id", task);

            try {
                var resp = await fetch(API_BASE + "/admin/transcripts?" + params.toString());
                var data = await resp.json();

                if (data.length === 0) {
                    container.innerHTML = '<div class="empty-state">No conversations found.</div>';
                    return;
                }

                container.innerHTML = "";
                data.forEach(function(t) {
                    var div = document.createElement("div");
                    div.className = "transcript-item";
                    div.onclick = function() { openTranscript(t.chat_id, t.student_id); };
                    div.innerHTML =
                        '<div class="info">' +
                        '  <div class="student">Student: ' + escapeHtml(t.student_id) + '</div>' +
                        '  <div class="meta">' +
                             (t.task_id ? 'Task: ' + escapeHtml(t.task_id) + ' | ' : '') +
                             'Started: ' + formatDate(t.started_at) +
                        '  </div>' +
                        '</div>' +
                        '<div class="badge">' + t.message_count + ' msgs</div>';
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = '<div class="empty-state">Error loading transcripts. Is the backend running?</div>';
            }
        }

        function clearFilters() {
            document.getElementById("filterStudent").value = "";
            document.getElementById("filterTask").value = "";
            loadTranscripts();
        }

        // --- Open Transcript Modal ---
        async function openTranscript(chatId, studentId) {
            document.getElementById("modalOverlay").classList.add("active");
            document.getElementById("modalTitle").textContent = "Transcript — " + studentId;
            var body = document.getElementById("modalBody");
            body.innerHTML = '<div class="loading">Loading...</div>';

            try {
                var resp = await fetch(API_BASE + "/admin/transcript/" + encodeURIComponent(chatId));
                var data = await resp.json();

                body.innerHTML = "";
                data.messages.forEach(function(msg) {
                    if (msg.role === "system") return;
                    var div = document.createElement("div");
                    div.className = "modal-message";
                    div.innerHTML =
                        '<div class="role ' + msg.role + '">' + msg.role + '</div>' +
                        '<div class="content">' + escapeHtml(msg.message) + '</div>' +
                        '<div class="timestamp">' + formatDate(msg.timestamp) + '</div>';
                    body.appendChild(div);
                });
            } catch (e) {
                body.innerHTML = '<div class="empty-state">Error loading transcript.</div>';
            }
        }

        function closeModal(event) {
            if (event && event.target && event.target !== document.getElementById("modalOverlay")) return;
            document.getElementById("modalOverlay").classList.remove("active");
        }

        // --- Export ---
        function exportCSV() {
            var student = document.getElementById("filterStudent").value.trim();
            var task = document.getElementById("filterTask").value.trim();
            var params = new URLSearchParams();
            if (student) params.set("student_id", student);
            if (task) params.set("task_id", task);
            window.open(API_BASE + "/admin/export/csv?" + params.toString(), "_blank");
        }

        function exportJSON() {
            var student = document.getElementById("filterStudent").value.trim();
            var task = document.getElementById("filterTask").value.trim();
            var params = new URLSearchParams();
            if (student) params.set("student_id", student);
            if (task) params.set("task_id", task);
            window.open(API_BASE + "/admin/export/json?" + params.toString(), "_blank");
        }

        // --- Helpers ---
        function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text;
            return d.innerHTML;
        }

        function formatDate(str) {
            if (!str) return "";
            var d = new Date(str);
            return d.toLocaleString();
        }

        // --- Init ---
        loadStats();
        loadTranscripts();
    </script>
</body>
</html>
